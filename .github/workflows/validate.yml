name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails if a generated manifest was not rebuilt after a source change,
      # and if a source file is malformed. This is the failure mode that
      # actually happens, and it needs no toolchain beyond Node.
      - run: node scripts/build.mjs --check
